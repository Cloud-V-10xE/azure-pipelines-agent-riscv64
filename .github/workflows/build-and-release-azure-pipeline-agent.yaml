name: Build Azure Pipelines Agent for RISC-V

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: RISCV64
    permissions:
      contents: write

    outputs:
      version-number: ${{ steps.check-version.outputs.agent_version }}
      tag-name: ${{ steps.set-tag.outputs.tag_name }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Clone azure-pipelines-agent
      run: |
        rm -rf azure-pipelines-agent
        git clone --branch main https://github.com/microsoft/azure-pipelines-agent.git

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblttng-ust-dev libkrb5-dev zlib1g-dev libicu-dev \
          libssl-dev libcurl4-openssl-dev libelf-dev libunwind-dev pkg-config wget tar libatomic1 \
          patchelf binutils file

    - name: Download and setup .NET 10.0.102 SDK
      run: |
        cd azure-pipelines-agent
        wget -q -O dotnet.tar.gz \
          https://github.com/filipnavara/dotnet-riscv/releases/download/10.0.102/dotnet-sdk-10.0.102-linux-riscv64.tar.gz
        mkdir -p _dotnetsdk/10.0.102
        tar -xf dotnet.tar.gz -C _dotnetsdk/10.0.102
        echo "10.0.102" > _dotnetsdk/10.0.102/.10.0.102
        rm dotnet.tar.gz
        echo "$PWD/_dotnetsdk/10.0.102" >> $GITHUB_PATH
        echo "DOTNET_ROOT=$PWD/_dotnetsdk/10.0.102" >> $GITHUB_ENV

    - name: Create net8.0 runtime packs from net10.0
      run: |
        cd azure-pipelines-agent
        SDK_ROOT="_dotnetsdk/10.0.102"
        PACKS_DIR="$SDK_ROOT/packs"

        NET10_RUNTIME_VERSION=$(ls -1 "$PACKS_DIR/Microsoft.NETCore.App.Runtime.linux-riscv64/" | head -1)
        NET10_HOST_VERSION=$(ls -1   "$PACKS_DIR/Microsoft.NETCore.App.Host.linux-riscv64/"    | head -1)
        NET10_ASPNET_VERSION=$(ls -1 "$PACKS_DIR/Microsoft.AspNetCore.App.Runtime.linux-riscv64/" | head -1)

        echo "net10.0 runtime: $NET10_RUNTIME_VERSION"
        echo "net10.0 host:    $NET10_HOST_VERSION"
        echo "net10.0 aspnet:  $NET10_ASPNET_VERSION"

        NET8_VERSION="8.0.23"
        for pair in \
          "Microsoft.NETCore.App.Runtime.linux-riscv64:$NET10_RUNTIME_VERSION" \
          "Microsoft.NETCore.App.Host.linux-riscv64:$NET10_HOST_VERSION" \
          "Microsoft.AspNetCore.App.Runtime.linux-riscv64:$NET10_ASPNET_VERSION"
        do
          PACK="${pair%%:*}"
          SRC="${pair##*:}"
          if [ ! -d "$PACKS_DIR/$PACK/$NET8_VERSION" ]; then
            cp -r "$PACKS_DIR/$PACK/$SRC" "$PACKS_DIR/$PACK/$NET8_VERSION"
            echo "✅ Created $PACK/$NET8_VERSION"
          fi
        done

    - name: Patch global.json for SDK 10.0.102
      run: |
        cd azure-pipelines-agent
        find . -name "global.json" -type f | while read -r json_file; do
          if grep -q "sdk" "$json_file"; then
            sed -i 's/"version".*:.*"[0-9].*"/"version": "10.0.102"/g' "$json_file"
            echo "Patched: $json_file"
          fi
        done

    - name: Patch dev.sh for RISC-V and .NET 10
      run: |
        cd azure-pipelines-agent
        python3 $GITHUB_WORKSPACE/scripts/patch_dev_sh.py src/dev.sh

        # Make chmod calls non-fatal for missing apphost binaries
        sed -i '/chmod.*bin\/Agent\./s/$/ 2>\/dev\/null || true/' src/dev.sh

        grep '_VALID_RIDS' src/dev.sh | grep -q 'linux-riscv64' \
          || { echo "❌ _VALID_RIDS patch failed"; exit 1; }
        echo "✅ dev.sh patched"

    - name: Patch externals.sh for RISC-V
      run: |
        cd azure-pipelines-agent
        python3 $GITHUB_WORKSPACE/scripts/patch_externals_sh.py src/Misc/externals.sh
        grep -q 'linux-riscv64' src/Misc/externals.sh \
          || { echo "❌ externals.sh patch failed"; exit 1; }
        echo "✅ externals.sh patched"

    - name: Patch SelfUpdater to disable auto-update
      run: |
        cd azure-pipelines-agent
        python3 $GITHUB_WORKSPACE/scripts/patch_self_updater.py src/Agent.Listener/SelfUpdater.cs
        echo "✅ SelfUpdater.cs patched"

        echo "Verifying:"
        grep -A 6 "private async Task<bool> UpdateNeeded" \
          src/Agent.Listener/SelfUpdater.cs | head -10

    - name: Add linux-riscv64 to RuntimeIdentifiers
      run: |
        cd azure-pipelines-agent
        find src -name "*.csproj" -type f | while read -r csproj; do
          if grep -q "<RuntimeIdentifiers>" "$csproj"; then
            if ! grep "<RuntimeIdentifiers>" "$csproj" | grep -q "linux-riscv64"; then
              sed -i 's/<RuntimeIdentifiers>\(.*\)<\/RuntimeIdentifiers>/<RuntimeIdentifiers>\1;linux-riscv64<\/RuntimeIdentifiers>/' "$csproj"
              echo "Patched: $csproj"
            fi
          fi
        done
        echo "✅ csproj files patched"

    - name: Patch VarUtil.cs for RISC-V architecture
      run: |
        cd azure-pipelines-agent
        python3 $GITHUB_WORKSPACE/scripts/patch_var_util.py \
          src/Microsoft.VisualStudio.Services.Agent/Util/VarUtil.cs
        echo "✅ VarUtil.cs patched"

    - name: Register linux-riscv64 for net8.0 in BundledVersions.props
      run: |
        cd azure-pipelines-agent
        PROPS_FILE="_dotnetsdk/10.0.102/sdk/10.0.102/Microsoft.NETCoreSdk.BundledVersions.props"
        python3 $GITHUB_WORKSPACE/scripts/patch_bundled_versions.py "$PROPS_FILE"
        grep -q 'linux-riscv64' "$PROPS_FILE" \
          || { echo "❌ BundledVersions patch failed"; exit 1; }
        echo "✅ BundledVersions.props patched"

    - name: Patch PlatformUtil.cs for RISC-V
      run: |
        cd azure-pipelines-agent
        python3 $GITHUB_WORKSPACE/scripts/patch_platform_util.py src/Agent.Sdk/Util/PlatformUtil.cs
        echo "✅ PlatformUtil.cs patched"

    - name: Write NuGet.config and pre-seed packages
      run: |
        cd azure-pipelines-agent
        LOCAL_FEED_DIR="$PWD/_local_nuget_feed"
        NUGET_PACKAGES_DIR="$PWD/_nuget_packages"
        mkdir -p "$LOCAL_FEED_DIR" "$NUGET_PACKAGES_DIR"
        echo "NUGET_PACKAGES=$NUGET_PACKAGES_DIR" >> $GITHUB_ENV

        # Write fresh NuGet.config with correct feeds
        cat > src/NuGet.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nugetvssprivate" value="https://pkgs.dev.azure.com/mseng/PipelineTools/_packaging/nugetvssprivate/nuget/v3/index.json" protocolVersion="3" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            <add key="PipelineTools" value="https://pkgs.dev.azure.com/mseng/PipelineTools/_packaging/PipelineTools_PublicPackages/nuget/v3/index.json" protocolVersion="3" />
            <add key="local-feed" value="${LOCAL_FEED_DIR}" />
          </packageSources>
          <disabledPackageSources />
        </configuration>
        EOF

        # Pre-seed ref packs
        for pkg in "microsoft.netcore.app.ref/8.0.23" "microsoft.aspnetcore.app.ref/8.0.23"; do
          PKG_NAME="${pkg%%/*}"
          PKG_VER="${pkg##*/}"
          DEST="$NUGET_PACKAGES_DIR/$pkg"
          NUPKG_FILE="$DEST/${PKG_NAME}.${PKG_VER}.nupkg"
          if [ ! -f "$NUPKG_FILE" ]; then
            mkdir -p "$DEST"
            wget -q -O "$NUPKG_FILE" \
              "https://api.nuget.org/v3-flatcontainer/${PKG_NAME}/${PKG_VER}/${PKG_NAME}.${PKG_VER}.nupkg"
            unzip -q -o "$NUPKG_FILE" -d "$DEST"
            openssl dgst -sha512 -binary "$NUPKG_FILE" | base64 -w 0 > "${NUPKG_FILE}.sha512"
            echo "✅ Cached $pkg"
          fi
        done

    - name: Inject Directory.Build.targets for linux-riscv64
      run: |
        cd azure-pipelines-agent
        cat > src/Directory.Build.targets <<'EOF'
        <Project>
          <PropertyGroup Condition="'$(RuntimeIdentifier)' == 'linux-riscv64'">
            <UseAppHost>false</UseAppHost>
            <SelfContained>false</SelfContained>
          </PropertyGroup>
        </Project>
        EOF
        echo "✅ Directory.Build.targets written"

    - name: Build
      run: |
        cd azure-pipelines-agent/src
        export DOTNET_MULTILEVEL_LOOKUP=0
        export DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
        ./dev.sh layout net8.0 Release linux-riscv64
      env:
        NUGET_PACKAGES: ${{ env.NUGET_PACKAGES }}

    - name: Bundle .NET runtime into layout
      run: |
        cd azure-pipelines-agent
        LAYOUT="_layout/linux-riscv64"
        SDK_DIR="_dotnetsdk/10.0.102"

        # Copy dotnet host
        cp "$SDK_DIR/dotnet" "$LAYOUT/bin/"
        chmod +x "$LAYOUT/bin/dotnet"

        # Copy host resolver
        mkdir -p "$LAYOUT/bin/host/fxr/10.0.2"
        cp "$SDK_DIR/host/fxr/10.0.2/libhostfxr.so" "$LAYOUT/bin/host/fxr/10.0.2/"

        # Copy shared framework — recursive, no error suppression.
        # The `/.` form copies the *contents* of the source dir (incl. any
        # subdirs and dotfiles) into the destination.
        mkdir -p "$LAYOUT/bin/shared/Microsoft.NETCore.App/10.0.2"
        cp -r "$SDK_DIR/shared/Microsoft.NETCore.App/10.0.2/." \
              "$LAYOUT/bin/shared/Microsoft.NETCore.App/10.0.2/"

        # Verify the critical runtime libraries actually made it across
        for lib in libcoreclr.so libhostpolicy.so libclrjit.so; do
          if [ ! -f "$LAYOUT/bin/shared/Microsoft.NETCore.App/10.0.2/$lib" ]; then
            echo "❌ Missing after copy: $lib"
            echo "--- Source dir ---"
            ls -la "$SDK_DIR/shared/Microsoft.NETCore.App/10.0.2/"
            echo "--- Destination ---"
            ls -la "$LAYOUT/bin/shared/Microsoft.NETCore.App/10.0.2/"
            exit 1
          fi
        done

        # Symlink native libs into bin/ so config.sh ldd checks pass
        for lib in libcoreclr.so libSystem.Security.Cryptography.Native.OpenSsl.so libSystem.IO.Compression.Native.so; do
          if [ ! -f "$LAYOUT/bin/$lib" ] && [ -f "$LAYOUT/bin/shared/Microsoft.NETCore.App/10.0.2/$lib" ]; then
            ln -sf "shared/Microsoft.NETCore.App/10.0.2/$lib" "$LAYOUT/bin/$lib"
          fi
        done

        python3 $GITHUB_WORKSPACE/scripts/patch_runtimeconfig.py "$LAYOUT/bin/"

        echo "✅ Runtime bundled and runtimeconfig patched"

    - name: Verify Build Output
      run: |
        cd azure-pipelines-agent
        echo "=== Verifying Build Output ==="

        for app in "Agent.Listener" "Agent.Worker" "Agent.PluginHost"; do
          DLL_PATH="_layout/linux-riscv64/bin/${app}.dll"
          echo "Checking $app..."
          [ -f "$DLL_PATH" ] && echo "  ✅ DLL exists: $DLL_PATH" \
            || { echo "  ❌ DLL missing: $DLL_PATH"; exit 1; }
        done

        echo ""
        echo "Checking bundled runtime..."
        ls -lh _layout/linux-riscv64/bin/dotnet || { echo "❌ dotnet host missing"; exit 1; }
        ls _layout/linux-riscv64/bin/host/fxr/10.0.2/libhostfxr.so \
          || { echo "❌ libhostfxr.so missing"; exit 1; }
        for lib in libcoreclr.so libhostpolicy.so libclrjit.so; do
          ls _layout/linux-riscv64/bin/shared/Microsoft.NETCore.App/10.0.2/$lib \
            || { echo "❌ $lib missing from bundled framework"; exit 1; }
        done
        echo "✅ All verified"

    - name: Test Agent Execution
      run: |
        cd azure-pipelines-agent/_layout/linux-riscv64/bin
        export DOTNET_ROOT="$PWD"
        echo "Testing with bundled dotnet..."
        ./dotnet Agent.Listener.dll --version \
          || { echo "❌ Agent execution failed"; exit 1; }
        echo "✅ Agent executed successfully"

    - name: Create launcher wrapper scripts
      run: |
        cd azure-pipelines-agent
        LAYOUT="_layout/linux-riscv64"

        for app in Agent.Listener Agent.Worker Agent.PluginHost; do
          cat > "$LAYOUT/bin/$app" <<'WRAPPER'
        #!/usr/bin/env bash
        SOURCE="${BASH_SOURCE[0]}"
        while [ -h "$SOURCE" ]; do
          DIR="$( cd -P "$( dirname "$SOURCE" )" && pwd )"
          SOURCE="$(readlink "$SOURCE")"
          [[ $SOURCE != /* ]] && SOURCE="$DIR/$SOURCE"
        done
        DIR="$( cd -P "$( dirname "$SOURCE" )" && pwd )"
        export DOTNET_ROOT="$DIR"
        exec "$DIR/dotnet" "$DIR/APPNAME.dll" "$@"
        WRAPPER
          sed -i "s/APPNAME/$app/g" "$LAYOUT/bin/$app"
          chmod +x "$LAYOUT/bin/$app"
        done
        echo "✅ Launcher wrappers created"

    - name: Package
      run: |
        cd azure-pipelines-agent/src
        export DOTNET_MULTILEVEL_LOOKUP=0
        ./dev.sh package net8.0 Release linux-riscv64

    - name: Check Version
      id: check-version
      run: |
        cd azure-pipelines-agent
        LAYOUT_BIN="_layout/linux-riscv64/bin"
        if [ -f "$LAYOUT_BIN/Agent.Listener.dll" ]; then
          export DOTNET_ROOT="$PWD/$LAYOUT_BIN"
          AGENT_VERSION=$("$LAYOUT_BIN/dotnet" "$LAYOUT_BIN/Agent.Listener.dll" --version 2>/dev/null || cat src/agentversion)
        else
          AGENT_VERSION=$(cat src/agentversion)
        fi
        echo "Azure Pipelines Agent version: $AGENT_VERSION"
        echo "agent_version=$AGENT_VERSION" >> $GITHUB_OUTPUT

    - name: Set tag name
      id: set-tag
      run: |
        TAG_NAME="v${{ steps.check-version.outputs.agent_version }}-riscv64-net8"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsts-agent-linux-riscv64-${{ steps.check-version.outputs.agent_version }}
        path: "azure-pipelines-agent/_package/*.tar.gz"

    - name: Create or verify tag
      run: |
        TAG="${{ steps.set-tag.outputs.tag_name }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "✅ Tag $TAG already exists. Will update release if needed."
        else
          echo "🆕 Creating tag $TAG..."
          git tag "$TAG"
          git push origin "$TAG"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.set-tag.outputs.tag_name }}
        name: "Azure Pipelines Agent ${{ steps.check-version.outputs.agent_version }} for RISC-V (net8.0)"
        body: |
          # Azure Pipelines Agent for RISC-V

          **Version:** ${{ steps.check-version.outputs.agent_version }}
          **Architecture:** linux-riscv64
          **Target Framework:** net8.0
          **Build Date:** ${{ github.event.head_commit.timestamp }}

          ## Build Details

          Built with .NET 10.0.102 SDK (RISC-V port by filipnavara), targeting net8.0.
          The agent bundles the .NET 10 runtime — no separate .NET installation required.

          ### Installation

          ```bash
          # Download and extract
          mkdir azagent && cd azagent
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.set-tag.outputs.tag_name }}/vsts-agent-linux-riscv64-${{ steps.check-version.outputs.agent_version }}.tar.gz
          tar xzf vsts-agent-linux-riscv64-${{ steps.check-version.outputs.agent_version }}.tar.gz

          # Configure
          ./config.sh --url https://dev.azure.com/YOUR-ORG --auth pat --token YOUR-PAT

          # Run interactively
          ./run.sh

          # Or install as a service
          sudo ./svc.sh install
          sudo ./svc.sh start
          ```

          ### System Requirements

          - RISC-V 64-bit processor
          - Linux operating system (Debian/Ubuntu recommended)
          - Standard system libraries (libc, libssl, libicu, etc.)

          ### Technical Details

          - **SDK Version:** .NET 10.0.102 (RISC-V build by filipnavara)
          - **Target Framework:** net8.0 (runs on bundled .NET 10 runtime, forward-compatible)
          - **Runtime Identifier:** linux-riscv64
          - **Deployment Mode:** Framework-dependent with bundled runtime
          - **Auto-update:** Disabled (no official RISC-V packages on releases)

          ### Credits

          - Azure Pipelines Agent: https://github.com/microsoft/azure-pipelines-agent
          - .NET RISC-V Port: https://github.com/filipnavara/dotnet-riscv
        files: azure-pipelines-agent/_package/*.tar.gz
        draft: false
        prerelease: false
        fail_on_unmatched_files: true